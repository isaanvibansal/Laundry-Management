{% extends "base.html" %}
{% block title %}Book a pickup — MUJ Hostel Laundry{% endblock %}
{% block content %}
<div class="page">
  <div class="container" style="max-width: 760px;">
    <div class="page-head">
      <div>
        <div class="eyebrow-tag">New booking</div>
        <h1>Book a laundry pickup</h1>
        <p>Fill in the details below — you'll get a tracking ticket as soon as you submit.</p>
      </div>
    </div>

    <form method="POST" class="card" id="bookForm">
      <div class="field">
        <label>Who's washing it?</label>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="service_provider" value="inhouse" checked onchange="toggleVendor()"> In-house hostel laundry
            <div class="hint">Everyday wash & fold, handled on campus</div>
          </label>
          <label class="radio-card">
            <input type="radio" name="service_provider" value="vendor" onchange="toggleVendor()"> External vendor
            <div class="hint">Dry cleaning, formal wear, faster turnaround</div>
          </label>
        </div>
      </div>

      <div class="field" id="vendorField" style="display:none;">
        <label for="vendor_id">Choose a vendor</label>
        <select name="vendor_id" id="vendor_id">
          {% for v in vendors %}
          <option value="{{ v['id'] }}">{{ v['name'] }} — ₹{{ v['price_per_kg']|round|int }}/kg · {{ v['turnaround_hours'] }}h · ⭐{{ v['rating'] }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="field">
          <label for="service_type">Service type</label>
          <select name="service_type" id="service_type" required>
            <option value="wash_fold">Wash & Fold (₹{{ price_table.wash_fold }}/kg)</option>
            <option value="wash_iron">Wash & Iron (₹{{ price_table.wash_iron }}/kg)</option>
            <option value="dry_clean">Dry Clean (₹{{ price_table.dry_clean }}/kg)</option>
            <option value="iron_only">Iron Only (₹{{ price_table.iron_only }}/kg)</option>
          </select>
        </div>
        <div class="field">
          <label for="weight_kg">Approx. weight (kg)</label>
          <input type="number" step="0.5" min="0.5" name="weight_kg" id="weight_kg" placeholder="e.g. 3.5">
          <div class="hint" id="weightHint">Leave blank for subscriptions — confirmed at pickup</div>
        </div>
      </div>

      <div class="field">
        <label for="items_description">What's in the bag?</label>
        <textarea name="items_description" id="items_description" placeholder="e.g. 4 shirts, 2 jeans, 1 bedsheet"></textarea>
      </div>

      <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="field">
          <label for="pickup_date">Pickup date</label>
          <input type="date" name="pickup_date" id="pickup_date" min="{{ today }}" required>
        </div>
        <div class="field">
          <label for="pickup_slot">Time slot</label>
          <select name="pickup_slot" id="pickup_slot" required>
            <option>Morning (8-10 AM)</option>
            <option>Afternoon (1-3 PM)</option>
            <option>Evening (5-7 PM)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
          <input type="checkbox" name="is_subscription" id="is_subscription" style="width:auto;" onchange="toggleRecurrence()">
          Make this a recurring subscription
        </label>
      </div>
      <div class="field" id="recurrenceField" style="display:none;">
        <label for="recurrence">Repeat</label>
        <select name="recurrence" id="recurrence">
          <option value="weekly">Every week</option>
          <option value="biweekly">Every two weeks</option>
        </select>
      </div>

      <div class="field">
        <label for="notes">Notes for the laundry team (optional)</label>
        <textarea name="notes" id="notes" placeholder="e.g. No starch, handle blazer with care"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Confirm pickup</button>
    </form>
  </div>
</div>

<script>
  function toggleVendor() {
    const isVendor = document.querySelector('input[name=service_provider]:checked').value === 'vendor';
    document.getElementById('vendorField').style.display = isVendor ? 'block' : 'none';
  }
  function toggleRecurrence() {
    const on = document.getElementById('is_subscription').checked;
    document.getElementById('recurrenceField').style.display = on ? 'block' : 'none';
    document.getElementById('weightHint').style.display = on ? 'block' : 'none';
  }
</script>
{% endblock %}
